name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
      - name: Set up CMake
        uses: lukka/get-cmake@v4.2.1
      - name: Configure CMake
        run: |
          pip install conan
          cmake --preset Debug
      - name: Run clang-tidy
        run: |
          clang-tidy \
            -p ./build/build-debug/compile_commands.json \
            --extra-arg=-std=c++20 \
            --quiet \
            src/**/*.cpp \
            tests/**/*.cpp
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
      - name: Run clang-format
        uses: jidicula/clang-format-action@v4.16.0
        with:
          exclude-regex: 'build/.*'
