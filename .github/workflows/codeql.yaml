name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: 0 0 * * 1

permissions:
  contents: read
  security-events: write

jobs:
  CodeQL:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.36.0
        with:
          languages: cpp
          build-mode: manual
      - name: Set up CMake
        uses: lukka/get-cmake@v4.3.3
      - name: Cache Conan
        uses: actions/cache@v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('**/conanfile.*') }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install \
            libegl-dev libegl1-mesa-dev \
            libx11-dev libx11-xcb-dev libfontenc-dev \
            libice-dev libsm-dev libxau-dev libxaw7-dev \
            libxcomposite-dev libxcursor-dev libxdamage-dev \
            libxext-dev libxfixes-dev libxi-dev libxinerama-dev \
            libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev \
            libxrandr-dev libxrender-dev libxres-dev libxss-dev \
            libxt-dev libxtst-dev libxv-dev libxxf86vm-dev \
            libxcb-glx0-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-dri3-dev libxcb-dri2-0-dev libxcb-present-dev \
            libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev \
            libxcb-cursor-dev libxcb-util-dev libxcb-util0-dev uuid-dev
      - name: Build C++ project
        run: |
          pip install conan
          cmake --preset Debug
          cmake --build build/debug
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.36.0
        with:
          category: /language:cpp
