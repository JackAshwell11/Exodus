name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: 0 0 * * 1

permissions:
  contents: read
  security-events: write

jobs:
  CodeQL:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.31.9
        with:
          languages: cpp
          build-mode: manual
          setup-python-dependencies: false
      - name: Set up CMake
        uses: lukka/get-cmake@v4.2.1
      - name: Cache Conan
        uses: actions/cache@v5.0.1
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('**/conanfile.*') }}
      - name: Build C++ project
        run: |
          pip install conan
          cmake --preset Debug
          cmake --build build/build-debug
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.31.9
        with:
          category: /language:cpp
